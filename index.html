note:`The name of a material.`,examples:`gold, water, wood, milk`},{name:`Countable Noun`,kn:`ಎಣಿಸಬಹುದಾದ ನಾಮಪದ`,note:`We can count it: one, two, three.`,examples:`book, pen, apple, chair`},{name:`Uncountable Noun`,kn:`ಎಣಿಸಲಾಗದ ನಾಮಪದ`,note:`We cannot count it one by one.`,examples:`rice, sugar, air, money`},{name:`Singular Noun`,kn:`ಏಕವಚನ`,note:`Only one.`,examples:`dog, girl, box`},{name:`Plural Noun`,kn:`ಬಹುವಚನ`,note:`More than one. Often add -s or -es.`,examples:`dogs, girls, boxes`}],examples:[{word:`boy`,kn:`ಹುಡುಗ`},{word:`school`,kn:`ಶಾಲೆ`},{word:`book`,kn:`ಪುಸ್ತಕ`},{word:`dog`,kn:`ನಾಯಿ`},{word:`happiness`,kn:`ಸಂತೋಷ`},{word:`teacher`,kn:`ಶಿಕ್ಷಕ`},{word:`river`,kn:`ನದಿ`},{word:`village`,kn:`ಹಳ್ಳಿ`},{word:`water`,kn:`ನೀರು`},{word:`friend`,kn:`ಸ್ನೇಹಿತ`}],sentences:[{en:`The boy is reading a book.`,kn:`ಹುಡುಗ ಪುಸ್ತಕ ಓದುತ್ತಿದ್ದಾನೆ.`,focus:`boy`},{en:`Our school is very big.`,kn:`ನಮ್ಮ ಶಾಲೆ ತುಂಬಾ ದೊಡ್ಡದಾಗಿದೆ.`,focus:`school`},{en:`Ravi lives in Mysuru.`,kn:`ರವಿ ಮೈಸೂರಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಾನೆ.`,focus:`Mysuru`},{en:`The dog is sleeping.`,kn:`ನಾಯಿ ಮಲಗಿದೆ.`,focus:`dog`},{en:`My teacher gave me a pen.`,kn:`ನನ್ನ ಶಿಕ್ಷಕರು ನನಗೆ ಪೆನ್ ಕೊಟ್ಟರು.`,focus:`teacher`},{en:`Honesty is a good habit.`,kn:`ಪ್ರಾಮಾಣಿಕತೆ ಒಳ್ಳೆಯ ಅಭ್ಯಾಸ.`,focus:`Honesty`},{en:`The river flows near our village.`,kn:`ನದಿ ನಮ್ಮ ಹಳ್ಳಿಯ ಹತ್ತಿರ ಹರಿಯುತ್ತದೆ.`,focus:`river`},{en:`There is water in the pot.`,kn:`ಮಡಕೆಯಲ್ಲಿ ನೀರಿದೆ.`,focus:`water`},{en:`The team won the match.`,kn:`ತಂಡ ಪಂದ್ಯವನ್ನು ಗೆದ್ದಿತು.`,focus:`team`},{en:`My friend has two sisters.`,kn:`ನನ್ನ ಸ್ನೇಹಿತನಿಗೆ ಇಬ್ಬರು ಸಹೋದರಿಯರಿದ್ದಾರೆ.`,focus:`friend`}],wordBank:[`boy`,`girl`,`school`,`book`,`pen`,`dog`,`cat`,`river`,`village`,`city`,`teacher`,`student`,`mother`,`father`,`water`,`milk`,`gold`,`team`,`family`,`happiness`],mistakes:[{wrong:`I have two book.`,right:`I have two books.`,why:`More than one needs the plural form.`,whyKn:`ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಇದ್ದಾಗ ಬಹುವಚನ ಬಳಸಬೇಕು.`},{wrong:`I live in mysuru.`,right:`I live in Mysuru.`,why:`Proper nouns take a capital letter.`,whyKn:`ವಿಶೇಷ ನಾಮಪದಕ್ಕೆ ದೊಡ್ಡ ಅಕ್ಷರ ಬೇಕು.`},{wrong:`She gave me many advices.`,right:`She gave me much advice.`,why:`Advice is uncountable.`,whyKn:`Advice ಎಣಿಸಲಾಗದ ಪದ.`}],quickCheck:[{q:`Which word is a noun?`,qKn:`ಯಾವ ಪದ noun?`,options:[`quickly`,`teacher`,`run`,`happy`],answer:1,explain:`“teacher” names a person, so it is a noun.`,explainKn:`“teacher” ವ್ಯಕ್ತಿಯ ಹೆಸರು, ಆದ್ದರಿಂದ noun.`},{q:`Pick the proper noun.`,options:[`river`,`Kaveri`,`water`,`village`],answer:1,explain:`Kaveri is a special name of a river.`},{q:`Which is an abstract noun?`,options:[`gold`,`chair`,`fear`,`cow`],answer:2,explain:`Fear is a feeling we cannot touch.`},{q:`Which is a collective noun?`,options:[`class`,`pen`,`boy`,`milk`],answer:0,explain:`A class is a group of students.`},{q:`Plural of “box” is`,options:[`boxs`,`boxes`,`boxies`,`box`],answer:1,explain:`Words ending in -x take -es.`}]},{slug:`pronoun`,name:`Pronoun`,kn:`ಸರ್ವನಾಮ`,icon:`🙋`,tone:`accent`,order:2,level:`Level 1 – Beginner`,definition:`A pronoun is a word used in place of a noun, so we do not repeat the same name again and again.`,definitionKn:`Pronoun ಎಂದರೆ noun ಬದಲಿಗೆ ಬಳಸುವ ಪದ. ಅದೇ ಹೆಸರನ್ನು ಮತ್ತೆ ಮತ್ತೆ ಹೇಳಬೇಕಾಗಿಲ್ಲ.`,identify:`If a word stands in the place of a name, it is a pronoun. Replace the name with he, she, it, they, we and check if the sentence still makes sense.`,identifyKn:`ಒಂದು ಪದ ಹೆಸರಿನ ಜಾಗದಲ್ಲಿ ಬಂದರೆ ಅದು pronoun. ಹೆಸರಿನ ಬದಲಿಗೆ he, she, it, they, we ಹಾಕಿ ನೋಡಿ.`,subtypes:[{name:`Personal Pronoun`,kn:`ಪುರುಷ ಸರ್ವನಾಮ`,note:`Used for people and things.`,examples:`I, you, he, she, it, we, they`},{name:`Possessive Pronoun`,kn:`ಸ್ವಾಮ್ಯ ಸರ್ವನಾಮ`,note:`Shows who owns something.`,examples:`mine, yours, his, hers, ours, theirs`},{name:`Demonstrative Pronoun`,kn:`ನಿರ್ದೇಶಕ ಸರ್ವನಾಮ`,note:`Points to something.`,examples:`this, that, these, those`},{name:`Interrogative Pronoun`,kn:`ಪ್ರಶ್ನಾರ್ಥಕ ಸರ್ವನಾಮ`,note:`Used to ask questions.`,examples:`who, whom, whose, what, which`},{name:`Reflexive Pronoun`,kn:`ಆತ್ಮಸೂಚಕ ಸರ್ವನಾಮ`,note:`Turns back to the doer.`,examples:`myself, yourself, himself, herself, themselves`},{name:`Relative Pronoun`,kn:`ಸಂಬಂಧ ಸರ್ವನಾಮ`,note:`Joins two parts of a sentence.`,examples:`who, whom, which, that`},{name:`Indefinite Pronoun`,kn:`ಅನಿಶ್ಚಿತ ಸರ್ವನಾಮ`,note:`Does not point to a fixed person.`,examples:`someone, anyone, everyone, nobody`}],examples:[{word:`I`,kn:`ನಾನು`},{word:`you`,kn:`ನೀನು / ನೀವು`},{word:`he`,kn:`ಅವನು`},{word:`she`,kn:`ಅವಳು`},{word:`it`,kn:`ಅದು`},{word:`we`,kn:`ನಾವು`},{word:`they`,kn:`ಅವರು / ಅವು`},{word:`this`,kn:`ಇದು`},{word:`that`,kn:`ಅದು`},{word:`myself`,kn:`ನಾನೇ`}],sentences:[{en:`Ravi is a boy. He is going to school.`,kn:`ರವಿ ಒಬ್ಬ ಹುಡುಗ. ಅವನು ಶಾಲೆಗೆ ಹೋಗುತ್ತಿದ್ದಾನೆ.`,focus:`He`},{en:`Sita is my sister. She sings well.`,kn:`ಸೀತಾ ನನ್ನ ಸಹೋದರಿ. ಅವಳು ಚೆನ್ನಾಗಿ ಹಾಡುತ್ತಾಳೆ.`,focus:`She`},{en:`The bag is heavy. It is full of books.`,kn:`ಚೀಲ ಭಾರವಾಗಿದೆ. ಅದು ಪುಸ್ತಕಗಳಿಂದ ತುಂಬಿದೆ.`,focus:`It`},{en:`We play in the ground every evening.`,kn:`ನಾವು ಪ್ರತಿ ಸಂಜೆ ಮೈದಾನದಲ್ಲಿ ಆಡುತ್ತೇವೆ.`,focus:`We`},{en:`They are my classmates.`,kn:`ಅವರು ನನ್ನ ಸಹಪಾಠಿಗಳು.`,focus:`They`},{en:`This is my pen.`,kn:`ಇದು ನನ್ನ ಪೆನ್.`,focus:`This`},{en:`Who is knocking at the door?`,kn:`ಬಾಗಿಲು ಬಡಿಯುತ್ತಿರುವವರು ಯಾರು?`,focus:`Who`},{en:`She cooked the food herself.`,kn:`ಅವಳೇ ಆಹಾರ ಬೇಯಿಸಿದಳು.`,focus:`herself`},{en:`That book is mine.`,kn:`ಆ ಪುಸ್ತಕ ನನ್ನದು.`,focus:`mine`},{en:`Everyone likes our teacher.`,kn:`ಎಲ್ಲರೂ ನಮ್ಮ ಶಿಕ್ಷಕರನ್ನು ಇಷ್ಟಪಡುತ್ತಾರೆ.`,focus:`Everyone`}],wordBank:[`I`,`me`,`my`,`mine`,`you`,`your`,`yours`,`he`,`him`,`his`,`she`,`her`,`hers`,`it`,`we`,`us`,`ours`,`they`,`them`,`myself`],tables:[{title:`Personal pronouns`,titleKn:`ಪುರುಷ ಸರ್ವನಾಮಗಳು`,head:[`English`,`ಕನ್ನಡ`],rows:[[`I`,`ನಾನು`],[`You`,`ನೀನು / ನೀವು`],[`He`,`ಅವನು`],[`She`,`ಅವಳು`],[`It`,`ಅದು`],[`We`,`ನಾವು`],[`They`,`ಅವರು / ಅವು`]]}],mistakes:[{wrong:`Me and Ravi went home.`,right:`Ravi and I went home.`,why:`Use I as the doer of the action.`,whyKn:`ಕ್ರಿಯೆ ಮಾಡುವವನಾಗಿ I ಬಳಸಬೇಕು.`},{wrong:`This is her book, not her.`,right:`This is her book, not hers.`,why:`Possessive pronouns stand alone: hers, mine, yours.`,whyKn:`ಸ್ವಾಮ್ಯ ಸರ್ವನಾಮ ಒಂದೇ ನಿಲ್ಲುತ್ತದೆ: hers, mine, yours.`},{wrong:`He cut hisself.`,right:`He cut himself.`,why:`The correct reflexive form is himself.`,whyKn:`ಸರಿಯಾದ ರೂಪ himself.`}],quickCheck:[{q:`Replace the name: “Ravi is tall. ___ plays cricket.”`,options:[`She`,`He`,`It`,`They`],answer:1,explain:`Ravi is a boy, so we use He.`},{q:`Which is a reflexive pronoun?`,options:[`mine`,`who`,`myself`,`these`],answer:2,explain:`Myself turns back to the speaker.`},{q:`Which pronoun asks a question?`,options:[`that`,`which`,`ours`,`them`],answer:1,explain:`Which is an interrogative pronoun.`},{q:`“The girls are here. ___ are my friends.”`,options:[`She`,`It`,`They`,`He`],answer:2,explain:`Girls is plural, so we use They.`}]},{slug:`verb`,name:`Verb`,kn:`ಕ್ರಿಯಾಪದ`,icon:`🏃`,tone:`sky`,order:3,level:`Level 2 – Elementary`,definition:`A verb is a doing word. It tells what someone does or what happens.`,definitionKn:`Verb ಎಂದರೆ ಕೆಲಸವನ್ನು ಅಥವಾ ಸ್ಥಿತಿಯನ್ನು ಸೂಚಿಸುವ ಪದ.`,identify:`Ask: what is the person doing? The answer word is the verb. Every complete sentence has at least one verb.`,identifyKn:`ಪ್ರಶ್ನೆ ಕೇಳಿ: ಅವನು/ಅವಳು ಏನು ಮಾಡುತ್ತಿದ್ದಾರೆ? ಆ ಉತ್ತರವೇ verb. ಪ್ರತಿ ಪೂರ್ಣ ವಾಕ್ಯದಲ್ಲಿ ಒಂದು verb ಇರುತ್ತದೆ.`,subtypes:[{name:`Action Verb`,kn:`ಕ್ರಿಯಾ ಪದ`,note:`Shows an action.`,examples:`run, eat, write, jump`},{name:`Helping Verb`,kn:`ಸಹಾಯಕ ಕ್ರಿಯಾಪದ`,note:`Helps the main verb.`,examples:`is, am, are, was, have, will, can`},{name:`Main Verb`,kn:`ಮುಖ್ಯ ಕ್ರಿಯಾಪದ`,note:`Carries the real meaning.`,examples:`She is singing. (singing)`},{name:`Regular Verb`,kn:`ನಿಯಮಿತ ಕ್ರಿಯಾಪದ`,note:`Adds -ed in the past.`,examples:`play – played – played`},{name:`Irregular Verb`,kn:`ಅನಿಯಮಿತ ಕ್ರಿಯಾಪದ`,note:`Changes its form.`,examples:`go – went – gone`},{name:`Transitive Verb`,kn:`ಸಕರ್ಮಕ ಕ್ರಿಯಾಪದ`,note:`Needs an object.`,examples:`He ate a mango.`},{name:`Intransitive Verb`,kn:`ಅಕರ್ಮಕ ಕ್ರಿಯಾಪದ`,note:`Does not need an object.`,examples:`The baby slept.`}],examples:[{word:`run`,kn:`ಓಡು`},{word:`eat`,kn:`ತಿನ್ನು`},{word:`write`,kn:`ಬರೆ`},{word:`read`,kn:`ಓದು`},{word:`sing`,kn:`ಹಾಡು`},{word:`sleep`,kn:`ಮಲಗು`},{word:`go`,kn:`ಹೋಗು`},{word:`come`,kn:`ಬಾ`},{word:`drink`,kn:`ಕುಡಿ`},{word:`play`,kn:`ಆಡು`}],sentences:[{en:`Ravi runs very fast.`,kn:`ರವಿ ತುಂಬಾ ವೇಗವಾಗಿ ಓಡುತ್ತಾನೆ.`,focus:`runs`},{en:`The children play in the garden.`,kn:`ಮಕ್ಕಳು ತೋಟದಲ್ಲಿ ಆಡುತ್ತಾರೆ.`,focus:`play`},{en:`She writes a letter.`,kn:`ಅವಳು ಪತ್ರ ಬರೆಯುತ್ತಾಳೆ.`,focus:`writes`},{en:`We are reading a story.`,kn:`ನಾವು ಕಥೆ ಓದುತ್ತಿದ್ದೇವೆ.`,focus:`reading`},{en:`The bird sings sweetly.`,kn:`ಹಕ್ಕಿ ಸಿಹಿಯಾಗಿ ಹಾಡುತ್ತದೆ.`,focus:`sings`},{en:`My father went to the market.`,kn:`ನನ್ನ ತಂದೆ ಮಾರುಕಟ್ಟೆಗೆ ಹೋದರು.`,focus:`went`},{en:`I have finished my homework.`,kn:`ನಾನು ನನ್ನ ಮನೆಕೆಲಸ ಮುಗಿಸಿದ್ದೇನೆ.`,focus:`finished`},{en:`The cow drinks water.`,kn:`ಹಸು ನೀರು ಕುಡಿಯುತ್ತದೆ.`,focus:`drinks`},{en:`They will come tomorrow.`,kn:`ಅವರು ನಾಳೆ ಬರುತ್ತಾರೆ.`,focus:`come`},{en:`The baby slept quietly.`,kn:`ಮಗು ಶಾಂತವಾಗಿ ಮಲಗಿತು.`,focus:`slept`}],wordBank:[`run`,`walk`,`eat`,`drink`,`write`,`read`,`sing`,`dance`,`sleep`,`jump`,`go`,`come`,`give`,`take`,`make`,`play`,`study`,`help`,`speak`,`listen`],tables:[{title:`Verb forms: V1 → V2 → V3`,titleKn:`ಕ್ರಿಯಾಪದದ ಮೂರು ರೂಪಗಳು`,head:[`V1`,`V2`,`V3`],rows:[[`go`,`went`,`gone`],[`eat`,`ate`,`eaten`],[`write`,`wrote`,`written`],[`see`,`saw`,`seen`],[`take`,`took`,`taken`],[`play`,`played`,`played`],[`study`,`studied`,`studied`]]}],mistakes:[{wrong:`He go to school every day.`,right:`He goes to school every day.`,why:`With he, she, it we add -s to the verb.`,whyKn:`he, she, it ಜೊತೆ verb ಗೆ -s ಸೇರಿಸಬೇಕು.`},{wrong:`I am go to market.`,right:`I am going to the market.`,why:`After am/is/are the verb takes -ing.`,whyKn:`am/is/are ನಂತರ verb ಗೆ -ing ಬರುತ್ತದೆ.`},{wrong:`She did not went.`,right:`She did not go.`,why:`After did we use the first form.`,whyKn:`did ನಂತರ ಮೊದಲ ರೂಪ ಬಳಸಬೇಕು.`}],quickCheck:[{q:`Which word is the verb? “The dog barks loudly.”`,options:[`dog`,`barks`,`loudly`,`The`],answer:1,explain:`Barks is the action.`},{q:`Past form of “eat” is`,options:[`eated`,`ate`,`eaten`,`eating`],answer:1,explain:`eat – ate – eaten.`},{q:`“Ravi ___ to school every day.”`,options:[`go`,`goes`,`going`,`gone`],answer:1,explain:`Ravi is like he, so goes.`},{q:`Which is a helping verb?`,options:[`write`,`is`,`quick`,`school`],answer:1,explain:`Is helps the main verb.`},{q:`Third form of “write” is`,options:[`wrote`,`writed`,`written`,`writing`],answer:2,explain:`write – wrote – written.`}]},{slug:`adjective`,name:`Adjective`,kn:`ಗುಣವಾಚಕ`,icon:`🎨`,tone:`violet`,order:4,level:`Level 2 – Elementary`,definition:`An adjective is a describing word. It tells us more about a noun or pronoun.`,definitionKn:`Adjective ಎಂದರೆ noun ಅಥವಾ pronoun ನ ಗುಣ, ಸಂಖ್ಯೆ ಅಥವಾ ಪ್ರಮಾಣವನ್ನು ಹೇಳುವ ಪದ.`,identify:`Ask: what kind? how many? which one? The answer is the adjective. It usually sits just before a noun.`,identifyKn:`ಪ್ರಶ್ನೆ ಕೇಳಿ: ಯಾವ ರೀತಿಯ? ಎಷ್ಟು? ಯಾವುದು? ಆ ಉತ್ತರವೇ adjective. ಇದು ಸಾಮಾನ್ಯವಾಗಿ noun ಮೊದಲು ಬರುತ್ತದೆ.`,subtypes:[{name:`Adjective of Quality`,kn:`ಗುಣ ಸೂಚಕ`,note:`Tells what kind.`,examples:`tall, kind, beautiful, old`},{name:`Adjective of Quantity`,kn:`ಪ್ರಮಾಣ ಸೂಚಕ`,note:`Tells how much.`,examples:`some, little, much, enough`},{name:`Adjective of Number`,kn:`ಸಂಖ್ಯಾ ಸೂಚಕ`,note:`Tells how many.`,examples:`two, many, few, first`},{name:`Demonstrative Adjective`,kn:`ನಿರ್ದೇಶಕ`,note:`Points to a noun.`,examples:`this book, those pens`},{name:`Possessive Adjective`,kn:`ಸ್ವಾಮ್ಯ ಸೂಚಕ`,note:`Shows belonging.`,examples:`my, your, his, her, our`},{name:`Interrogative Adjective`,kn:`ಪ್ರಶ್ನಾರ್ಥಕ`,note:`Asks about a noun.`,examples:`which pen? whose bag?`}],examples:[{word:`tall`,kn:`ಎತ್ತರ`},{word:`short`,kn:`ಚಿಕ್ಕ`},{word:`beautiful`,kn:`ಸುಂದರ`},{word:`kind`,kn:`ದಯಾಳು`},{word:`big`,kn:`ದೊಡ್ಡ`},{word:`small`,kn:`ಸಣ್ಣ`},{word:`clever`,kn:`ಚತುರ`},{word:`sweet`,kn:`ಸಿಹಿ`},{word:`old`,kn:`ಹಳೆಯ`},{word:`new`,kn:`ಹೊಸ`}],sentences:[{en:`Ravi is a tall boy.`,kn:`ರವಿ ಎತ್ತರದ ಹುಡುಗ.`,focus:`tall`},{en:`She has a beautiful dress.`,kn:`ಅವಳಿಗೆ ಸುಂದರವಾದ ಉಡುಪು ಇದೆ.`,focus:`beautiful`},{en:`Our teacher is very kind.`,kn:`ನಮ್ಮ ಶಿಕ್ಷಕರು ತುಂಬಾ ದಯಾಳು.`,focus:`kind`},{en:`I ate two mangoes.`,kn:`ನಾನು ಎರಡು ಮಾವಿನ ಹಣ್ಣು ತಿಂದೆ.`,focus:`two`},{en:`This book is new.`,kn:`ಈ ಪುಸ್ತಕ ಹೊಸದು.`,focus:`new`},{en:`There is little water in the jug.`,kn:`ಜಗ್‌ನಲ್ಲಿ ಸ್ವಲ್ಪ ನೀರಿದೆ.`,focus:`little`},{en:`My bag is heavy.`,kn:`ನನ್ನ ಚೀಲ ಭಾರವಾಗಿದೆ.`,focus:`heavy`},{en:`Which pen is yours?`,kn:`ಯಾವ ಪೆನ್ ನಿಮ್ಮದು?`,focus:`Which`},{en:`The old man walks slowly.`,kn:`ಹಳೆಯ ವಯಸ್ಸಿನ ವ್ಯಕ್ತಿ ನಿಧಾನವಾಗಿ ನಡೆಯುತ್ತಾನೆ.`,focus:`old`},{en:`These mangoes are sweet.`,kn:`ಈ ಮಾವಿನ ಹಣ್ಣುಗಳು ಸಿಹಿಯಾಗಿವೆ.`,focus:`sweet`}],wordBank:[`tall`,`short`,`big`,`small`,`long`,`kind`,`clever`,`brave`,`honest`,`lazy`,`sweet`,`sour`,`old`,`new`,`clean`,`dirty`,`happy`,`sad`,`heavy`,`light`],tables:[{title:`Degrees of comparison`,titleKn:`ಹೋಲಿಕೆಯ ಮೂರು ಹಂತಗಳು`,head:[`Positive`,`Comparative`,`Superlative`],rows:[[`tall`,`taller`,`tallest`],[`big`,`bigger`,`biggest`],[`happy`,`happier`,`happiest`],[`beautiful`,`more beautiful`,`most beautiful`],[`good`,`better`,`best`],[`bad`,`worse`,`worst`]]}],mistakes:[{wrong:`She is more taller than me.`,right:`She is taller than me.`,why:`Do not use more with -er.`,whyKn:`-er ಜೊತೆ more ಬಳಸಬಾರದು.`},{wrong:`He is the more clever boy in class.`,right:`He is the cleverest boy in class.`,why:`Comparing with a whole group needs the superlative.`,whyKn:`ಇಡೀ ಗುಂಪಿನೊಂದಿಗೆ ಹೋಲಿಸುವಾಗ superlative ಬೇಕು.`},{wrong:`These is my books.`,right:`These are my books.`,why:`These is plural.`,whyKn:`These ಬಹುವಚನ.`}],quickCheck:[{q:`Which word is the adjective? “The bright sun rose.”`,options:[`sun`,`bright`,`rose`,`The`],answer:1,explain:`Bright describes the sun.`},{q:`Comparative of “good” is`,options:[`gooder`,`better`,`best`,`more good`],answer:1,explain:`good – better – best.`},{q:`Which is an adjective of number?`,options:[`sweet`,`seven`,`slowly`,`run`],answer:1,explain:`Seven tells how many.`},{q:`Superlative of “big” is`,options:[`bigger`,`biggest`,`most big`,`big`],answer:1,explain:`big – bigger – biggest.`}]},{slug:`adverb`,name:`Adverb`,kn:`ಕ್ರಿಯಾವಿಶೇಷಣ`,icon:`⚡`,tone:`teal`,order:5,level:`Level 3 – Intermediate`,definition:`An adverb tells us more about a verb, an adjective, or another adverb — how, when, where, or how often.`,definitionKn:`Adverb ಎಂದರೆ verb, adjective ಅಥವಾ ಇನ್ನೊಂದು adverb ಬಗ್ಗೆ ಹೆಚ್ಚು ಹೇಳುವ ಪದ — ಹೇಗೆ, ಯಾವಾಗ, ಎಲ್ಲಿ, ಎಷ್ಟು ಬಾರಿ.`,identify:`Ask: how? when? where? how often? Many adverbs end in -ly. An adjective describes a noun; an adverb describes a verb.`,identifyKn:`ಪ್ರಶ್ನೆ ಕೇಳಿ: ಹೇಗೆ? ಯಾವಾಗ? ಎಲ್ಲಿ? ಹಲವು adverb ಗಳು -ly ನಲ್ಲಿ ಕೊನೆಯಾಗುತ್ತವೆ. Adjective noun ಬಗ್ಗೆ, adverb verb ಬಗ್ಗೆ ಹೇಳುತ್ತದೆ.`,subtypes:[{name:`Adverb of Manner`,kn:`ರೀತಿ ಸೂಚಕ`,note:`How the work is done.`,examples:`slowly, quickly, carefully`},{name:`Adverb of Place`,kn:`ಸ್ಥಳ ಸೂಚಕ`,note:`Where it happens.`,examples:`here, there, outside, near`},{name:`Adverb of Time`,kn:`ಕಾಲ ಸೂಚಕ`,note:`When it happens.`,examples:`now, today, yesterday, soon`},{name:`Adverb of Frequency`,kn:`ಪುನರಾವೃತ್ತಿ ಸೂಚಕ`,note:`How often.`,examples:`always, often, never, daily`},{name:`Adverb of Degree`,kn:`ಪ್ರಮಾಣ ಸೂಚಕ`,note:`How much.`,examples:`very, too, almost, quite`}],examples:[{word:`slowly`,kn:`ನಿಧಾನವಾಗಿ`},{word:`quickly`,kn:`ಬೇಗನೆ`},{word:`carefully`,kn:`ಎಚ್ಚರಿಕೆಯಿಂದ`},{word:`loudly`,kn:`ಜೋರಾಗಿ`},{word:`here`,kn:`ಇಲ್ಲಿ`},{word:`there`,kn:`ಅಲ್ಲಿ`},{word:`today`,kn:`ಇಂದು`},{word:`always`,kn:`ಯಾವಾಗಲೂ`},{word:`never`,kn:`ಎಂದಿಗೂ ಇಲ್ಲ`},{word:`very`,kn:`ತುಂಬಾ`}],sentences:[{en:`The boy runs quickly.`,kn:`ಹುಡುಗ ಬೇಗನೆ ಓಡುತ್ತಾನೆ.`,focus:`quickly`},{en:`She speaks softly.`,kn:`ಅವಳು ಮೃದುವಾಗಿ ಮಾತನಾಡುತ್ತಾಳೆ.`,focus:`softly`},{en:`Please write carefully.`,kn:`ದಯವಿಟ್ಟು ಎಚ್ಚರಿಕೆಯಿಂದ ಬರೆಯಿರಿ.`,focus:`carefully`},{en:`Come here at once.`,kn:`ಈಗಲೇ ಇಲ್ಲಿ ಬಾ.`,focus:`here`},{en:`We went to the temple yesterday.`,kn:`ನಾವು ನಿನ್ನೆ ದೇವಸ್ಥಾನಕ್ಕೆ ಹೋದೆವು.`,focus:`yesterday`},{en:`He always helps his friends.`,kn:`ಅವನು ಯಾವಾಗಲೂ ತನ್ನ ಸ್ನೇಹಿತರಿಗೆ ಸಹಾಯ ಮಾಡುತ್ತಾನೆ.`,focus:`always`},{en:`The mango is very sweet.`,kn:`ಮಾವಿನ ಹಣ್ಣು ತುಂಬಾ ಸಿಹಿಯಾಗಿದೆ.`,focus:`very`},{en:`She never tells a lie.`,kn:`ಅವಳು ಎಂದಿಗೂ ಸುಳ್ಳು ಹೇಳುವುದಿಲ್ಲ.`,focus:`never`},{en:`The bell rang loudly.`,kn:`ಗಂಟೆ ಜೋರಾಗಿ ಬಾರಿಸಿತು.`,focus:`loudly`},{en:`They will reach home soon.`,kn:`ಅವರು ಬೇಗನೆ ಮನೆಗೆ ತಲುಪುತ್ತಾರೆ.`,focus:`soon`}],wordBank:[`slowly`,`quickly`,`carefully`,`loudly`,`softly`,`well`,`badly`,`here`,`there`,`outside`,`now`,`then`,`today`,`yesterday`,`soon`,`always`,`often`,`never`,`very`,`quite`],tables:[{title:`Adjective → Adverb`,titleKn:`Adjective ನಿಂದ Adverb`,head:[`Adjective`,`Adverb`],rows:[[`slow`,`slowly`],[`quick`,`quickly`],[`careful`,`carefully`],[`happy`,`happily`],[`good`,`well`]]}],mistakes:[{wrong:`He runs quick.`,right:`He runs quickly.`,why:`A verb needs an adverb, not an adjective.`,whyKn:`Verb ಗೆ adverb ಬೇಕು, adjective ಅಲ್ಲ.`},{wrong:`She sings good.`,right:`She sings well.`,why:`The adverb of good is well.`,whyKn:`Good ನ adverb ರೂಪ well.`},{wrong:`I am very much happy.`,right:`I am very happy.`,why:`Very is enough.`,whyKn:`Very ಸಾಕು.`}],quickCheck:[{q:`“The boy runs quickly.” What is “quickly”?`,options:[`Noun`,`Verb`,`Adverb`,`Adjective`],answer:2,explain:`It tells how he runs.`},{q:`Adverb form of “careful” is`,options:[`carefuly`,`carefully`,`carefull`,`care`],answer:1,explain:`careful + ly = carefully.`},{q:`Which is an adverb of time?`,options:[`here`,`never`,`tomorrow`,`very`],answer:2,explain:`Tomorrow tells when.`},{q:`Which sentence is correct?`,options:[`She sings good.`,`She sings well.`,`She sing well.`,`She good sings.`],answer:1,explain:`Well is the adverb of good.`}]},{slug:`preposition`,name:`Preposition`,kn:`ಸಂಬಂಧಸೂಚಕ`,icon:`📍`,tone:`rose`,order:6,level:`Level 3 – Intermediate`,definition:`A preposition is a small word placed before a noun to show place, time, or direction.`,definitionKn:`Preposition ಎಂದರೆ noun ಮೊದಲು ಬಂದು ಸ್ಥಳ, ಸಮಯ ಅಥವಾ ದಿಕ್ಕನ್ನು ತೋರಿಸುವ ಸಣ್ಣ ಪದ.`,identify:`Look for a small word that answers where or when, and is followed by a noun: on the table, at 5 o'clock, under the tree.`,identifyKn:`ಎಲ್ಲಿ ಅಥವಾ ಯಾವಾಗ ಎಂದು ಉತ್ತರಿಸುವ ಸಣ್ಣ ಪದವನ್ನು ಹುಡುಕಿ, ಅದರ ನಂತರ noun ಬರುತ್ತದೆ.`,subtypes:[{name:`Preposition of Place`,kn:`ಸ್ಥಳ`,note:`Shows where.`,examples:`in, on, at, under, behind`},{name:`Preposition of Time`,kn:`ಸಮಯ`,note:`Shows when.`,examples:`at, on, in, before, after`},{name:`Preposition of Direction`,kn:`ದಿಕ್ಕು`,note:`Shows movement.`,examples:`to, into, from, towards`}],examples:[{word:`in`,kn:`ಒಳಗೆ`},{word:`on`,kn:`ಮೇಲೆ`},{word:`at`,kn:`ಹತ್ತಿರ / ನಲ್ಲಿ`},{word:`under`,kn:`ಕೆಳಗೆ`},{word:`above`,kn:`ಮೇಲ್ಭಾಗದಲ್ಲಿ`},{word:`below`,kn:`ಕೆಳಭಾಗದಲ್ಲಿ`},{word:`beside`,kn:`ಪಕ್ಕದಲ್ಲಿ`},{word:`between`,kn:`ನಡುವೆ`},{word:`behind`,kn:`ಹಿಂದೆ`},{word:`near`,kn:`ಹತ್ತಿರ`}],sentences:[{en:`The book is on the table.`,kn:`ಪುಸ್ತಕ ಮೇಜಿನ ಮೇಲೆ ಇದೆ.`,focus:`on`},{en:`The cat is under the chair.`,kn:`ಬೆಕ್ಕು ಕುರ್ಚಿಯ ಕೆಳಗೆ ಇದೆ.`,focus:`under`},{en:`There is water in the pot.`,kn:`ಮಡಕೆಯ ಒಳಗೆ ನೀರಿದೆ.`,focus:`in`},{en:`We reach school at eight o'clock.`,kn:`ನಾವು ಎಂಟು ಗಂಟೆಗೆ ಶಾಲೆಗೆ ತಲುಪುತ್ತೇವೆ.`,focus:`at`},{en:`The shop is near my house.`,kn:`ಅಂಗಡಿ ನನ್ನ ಮನೆಯ ಹತ್ತಿರ ಇದೆ.`,focus:`near`},{en:`She sat beside her mother.`,kn:`ಅವಳು ತನ್ನ ತಾಯಿಯ ಪಕ್ಕದಲ್ಲಿ ಕುಳಿತಳು.`,focus:`beside`},{en:`The ball rolled behind the door.`,kn:`ಚೆಂಡು ಬಾಗಿಲಿನ ಹಿಂದೆ ಉರುಳಿತು.`,focus:`behind`},{en:`Divide the sweets between the two boys.`,kn:`ಸಿಹಿತಿಂಡಿಗಳನ್ನು ಇಬ್ಬರು ಹುಡುಗರ ನಡುವೆ ಹಂಚಿ.`,focus:`between`},{en:`The bird flew above the tree.`,kn:`ಹಕ್ಕಿ ಮರದ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಹಾರಿತು.`,focus:`above`},{en:`He came from Bengaluru.`,kn:`ಅವನು ಬೆಂಗಳೂರಿನಿಂದ ಬಂದನು.`,focus:`from`}],wordBank:[`in`,`on`,`at`,`under`,`over`,`above`,`below`,`beside`,`between`,`behind`,`near`,`from`,`to`,`with`,`by`,`for`,`into`,`through`,`before`,`after`],mistakes:[{wrong:`I am good in English.`,right:`I am good at English.`,why:`We say good at a subject or skill.`,whyKn:`ವಿಷಯದ ಬಗ್ಗೆ good at ಎನ್ನುತ್ತೇವೆ.`},{wrong:`She is sitting in the chair.`,right:`She is sitting on the chair.`,why:`On is used for a surface.`,whyKn:`ಮೇಲ್ಮೈಗೆ on ಬಳಸುತ್ತೇವೆ.`},{wrong:`We reached at home.`,right:`We reached home.`,why:`Reach does not need at before home.`,whyKn:`Reach ನಂತರ home ಗೆ at ಬೇಡ.`}],quickCheck:[{q:`“The pen is ___ the box.” (inside)`,options:[`on`,`in`,`at`,`over`],answer:1,explain:`Inside means in.`},{q:`Choose the preposition: “He jumped over the wall.”`,options:[`He`,`jumped`,`over`,`wall`],answer:2,explain:`Over shows direction.`},{q:`“School starts ___ 9 a.m.”`,options:[`in`,`on`,`at`,`to`],answer:2,explain:`We use at with clock time.`},{q:`“My birthday is ___ June.”`,options:[`at`,`in`,`on`,`by`],answer:1,explain:`We use in with months.`}]},{slug:`conjunction`,name:`Conjunction`,kn:`ಸಂಯೋಜಕ`,icon:`🔗`,tone:`success`,order:7,level:`Level 3 – Intermediate`,definition:`A conjunction is a joining word. It joins two words, phrases, or sentences.`,definitionKn:`Conjunction ಎಂದರೆ ಎರಡು ಪದಗಳನ್ನು, ಪದಗುಚ್ಛಗಳನ್ನು ಅಥವಾ ವಾಕ್ಯಗಳನ್ನು ಜೋಡಿಸುವ ಪದ.`,identify:`Look at the point where two ideas meet. The word joining them is the conjunction.`,identifyKn:`ಎರಡು ಆಲೋಚನೆಗಳು ಸೇರುವ ಜಾಗವನ್ನು ನೋಡಿ. ಅವುಗಳನ್ನು ಜೋಡಿಸುವ ಪದವೇ conjunction.`,subtypes:[{name:`Joining ideas`,kn:`ಸೇರಿಸುವುದು`,note:`Adds one idea to another.`,examples:`and, also, as well as`},{name:`Showing difference`,kn:`ವ್ಯತ್ಯಾಸ`,note:`Shows opposite ideas.`,examples:`but, although, yet`},{name:`Showing choice`,kn:`ಆಯ್ಕೆ`,note:`Gives a choice.`,examples:`or, either…or, neither…nor`},{name:`Showing reason or result`,kn:`ಕಾರಣ / ಫಲಿತಾಂಶ`,note:`Gives a reason or result.`,examples:`because, so, since`},{name:`Showing time or condition`,kn:`ಕಾಲ / ಷರತ್ತು`,note:`Tells when or if.`,examples:`when, while, before, after, if`}],examples:[{word:`and`,kn:`ಮತ್ತು`},{word:`but`,kn:`ಆದರೆ`},{word:`or`,kn:`ಅಥವಾ`},{word:`because`,kn:`ಏಕೆಂದರೆ`},{word:`so`,kn:`ಆದ್ದರಿಂದ`},{word:`if`,kn:`ಒಂದು ವೇಳೆ`},{word:`although`,kn:`ಆದಾಗ್ಯೂ`},{word:`when`,kn:`ಯಾವಾಗ`},{word:`while`,kn:`ಆ ಸಮಯದಲ್ಲಿ`},{word:`after`,kn:`ನಂತರ`}],sentences:[{en:`Ravi is poor but honest.`,kn:`ರವಿ ಬಡವನಾದರೂ ಪ್ರಾಮಾಣಿಕ.`,focus:`but`},{en:`Sita and Geeta are friends.`,kn:`ಸೀತಾ ಮತ್ತು ಗೀತಾ ಸ್ನೇಹಿತರು.`,focus:`and`},{en:`Do you want tea or coffee?`,kn:`ನಿಮಗೆ ಚಾ ಅಥವಾ ಕಾಫಿ ಬೇಕೇ?`,focus:`or`},{en:`He was late because the bus broke down.`,kn:`ಬಸ್ ಕೆಟ್ಟುಹೋದ್ದರಿಂದ ಅವನು ತಡವಾಗಿ ಬಂದನು.`,focus:`because`},{en:`It was raining, so we stayed at home.`,kn:`ಮಳೆ ಬರುತ್ತಿತ್ತು, ಆದ್ದರಿಂದ ನಾವು ಮನೆಯಲ್ಲಿ ಇದ್ದೆವು.`,focus:`so`},{en:`If you study well, you will pass.`,kn:`ಚೆನ್ನಾಗಿ ಓದಿದರೆ ನೀವು ಉತ್ತೀರ್ಣರಾಗುತ್ತೀರಿ.`,focus:`If`},{en:`Although he is small, he is strong.`,kn:`ಅವನು ಚಿಕ್ಕವನಾದರೂ ಬಲಶಾಲಿ.`,focus:`Although`},{en:`Wash your hands before you eat.`,kn:`ತಿನ್ನುವ ಮೊದಲು ಕೈ ತೊಳೆಯಿರಿ.`,focus:`before`},{en:`She sang while I played the flute.`,kn:`ನಾನು ಕೊಳಲು ನುಡಿಸುತ್ತಿದ್ದಾಗ ಅವಳು ಹಾಡಿದಳು.`,focus:`while`},{en:`We went home after the class ended.`,kn:`ತರಗತಿ ಮುಗಿದ ನಂತರ ನಾವು ಮನೆಗೆ ಹೋದೆವು.`,focus:`after`}],wordBank:[`and`,`but`,`or`,`so`,`because`,`if`,`although`,`though`,`when`,`while`,`before`,`after`,`until`,`since`,`unless`,`yet`,`also`,`either`,`neither`,`as`],mistakes:[{wrong:`Although he is poor, but he is happy.`,right:`Although he is poor, he is happy.`,why:`Do not use although and but together.`,whyKn:`Although ಮತ್ತು but ಒಟ್ಟಿಗೆ ಬಳಸಬಾರದು.`},{wrong:`Because he was ill, so he stayed home.`,right:`Because he was ill, he stayed home.`,why:`Use only one joining word.`,whyKn:`ಒಂದೇ ಜೋಡಿಸುವ ಪದ ಸಾಕು.`},{wrong:`He neither came or called.`,right:`He neither came nor called.`,why:`Neither pairs with nor.`,whyKn:`Neither ಜೊತೆ nor ಬರುತ್ತದೆ.`}],quickCheck:[{q:`“She is tired ___ she keeps working.”`,options:[`and`,`but`,`because`,`so`],answer:1,explain:`But shows a difference.`},{q:`“I stayed home ___ it was raining.”`,options:[`but`,`or`,`because`,`although`],answer:2,explain:`Because gives the reason.`},{q:`Which word joins two sentences?`,options:[`quickly`,`and`,`book`,`tall`],answer:1,explain:`And is a conjunction.`}, ray`},{en:`Well done! You solved the sum.`,kn:`ಚೆನ್ನಾಗಿ ಮಾಡಿದೆ! ನೀನು ಲೆಕ್ಕ ಬಿಡಿಸಿದೆ.`,focus:`Well done`}],wordBank:[`Wow`,`Oh`,`Ah`,`Aha`,`Alas`,`Hurrah`,`Hurray`,`Oops`,`Bravo`,`Hush`,`Well done`,`Oh no`,`Yay`,`Ouch`,`Hey`,`Look`,`Listen`,`Please`,`Thanks`,`Sorry`],mistakes:[{wrong:`Wow. What a nice day.`,right:`Wow! What a nice day!`,why:`Interjections take an exclamation mark.`,whyKn:`Interjection ನಂತರ ಆಶ್ಚರ್ಯ ಚಿಹ್ನೆ ಬೇಕು.`},{wrong:`Alas! we won the game.`,right:`Hurrah! We won the game.`,why:`Alas shows sorrow, not joy.`,whyKn:`Alas ದುಃಖವನ್ನು ತೋರಿಸುತ್ತದೆ, ಸಂತೋಷವನ್ನಲ್ಲ.`},{wrong:`Oh is a verb.`,right:`Oh is an interjection.`,why:`Oh shows a feeling, not an action.`,whyKn:`Oh ಭಾವನೆಯನ್ನು ತೋರಿಸುತ್ತದೆ.`}],quickCheck:[{q:`Which emotion does “Alas!” show?`,options:[`Joy`,`Sorrow`,`Surprise`,`Anger`],answer:1,explain:`Alas shows sadness.`},{q:`“___! We won the match.”`,options:[`Alas`,`Hurrah`,`Hush`,`Oops`],answer:1,explain:`Hurrah shows joy.`},{q:`Which word is an interjection?`,options:[`quickly`,`Wow`,`table`,`run`],answer:1,explain:`Wow shows surprise.`},{q:`“Hush!” asks us to`,options:[`shout`,`be quiet`,`run`,`sing`],answer:1,explain:`Hush means be quiet.`}]},{slug:`article`,name:`Articles & Determiners`,kn:`ಉಪಪದಗಳು`,icon:`🔤`,tone:`primary`,order:9,level:`Level 1 – Beginner`,definition:`A, an, and the are articles. They come before a noun. Determiners like this, my, some also point to nouns.`,definitionKn:`A, an, the ಗಳು articles. ಇವು noun ಮೊದಲು ಬರುತ್ತವೆ. this, my, some ಗಳು determiners.`,identify:`Use a before a consonant sound, an before a vowel sound, and the for something already known.`,identifyKn:`ವ್ಯಂಜನ ಧ್ವನಿಯ ಮೊದಲು a, ಸ್ವರ ಧ್ವನಿಯ ಮೊದಲು an, ಈಗಾಗಲೇ ಗೊತ್ತಿರುವುದಕ್ಕೆ the ಬಳಸಿ.`,subtypes:[{name:`a`,kn:`ಒಂದು`,note:`Before a consonant sound.`,examples:`a boy, a school, a river`},{name:`an`,kn:`ಒಂದು`,note:`Before a vowel sound.`,examples:`an apple, an egg, an hour`},{name:`the`,kn:`ಆ / ಈ`,note:`For something special or already known.`,examples:`the sun, the Kaveri,
